<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Goose Pursuit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #canvas-wrap {
      position: relative;
      /* sized by JS resize() */
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Overlay: menu / pause */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(40, 40, 40, 0.93);
      color: #fff;
      font-family: Arial, sans-serif;
      gap: 4%;
    }
    #overlay h1 { font-size: clamp(1.4rem, 5vw, 2.4rem); }
    #overlay p  { font-size: clamp(1rem,  3vw, 1.4rem); }
    #overlay button {
      font-size: clamp(1rem, 3vw, 1.4rem);
      padding: 3% 10%;
      border: none;
      background: #555;
      color: #fff;
      cursor: pointer;
      border-radius: 6px;
      touch-action: manipulation;
    }
    #overlay button:hover, #overlay button:active { background: #777; }
    #overlay.hidden { display: none; }

    /* On-screen pause button (visible during gameplay on mobile) */
    #pause-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      background: rgba(0,0,0,0.45);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: clamp(0.7rem, 2vw, 0.9rem);
      padding: 4px 10px;
      cursor: pointer;
      touch-action: manipulation;
      display: none;
    }
    #pause-btn.visible { display: block; }
  </style>
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="game" width="800" height="480"></canvas>
    <div id="overlay">
      <h1 id="overlay-heading">Main Menu</h1>
      <p id="overlay-count">Count: 0</p>
      <p id="overlay-highscore">High Score: 0</p>
      <button id="overlay-btn">Start Game</button>
    </div>
    <button id="pause-btn">⏸ Pause</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
